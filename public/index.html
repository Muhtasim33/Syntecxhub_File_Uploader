<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DropLab - Google Drive Clone</title>
  <link rel="stylesheet" href="/css/style.css">
  <!-- Google Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>

  <div class="app-container" id="app">
    <!-- Rendered Dynamically via JS (Sidebar, Top bar, File Grid) -->
  </div>

  <!-- Modals Container -->
  <div id="modal-container"></div>

  <div id="auth-modal" class="auth-screen" style="display: none;">
    <section class="auth-card" aria-labelledby="auth-title">
      <div class="auth-form-panel">
        <div class="auth-mobile-brand">
          <span class="auth-brand-mark" aria-hidden="true">D</span>
          <span>DropLab</span>
        </div>
        <h1 id="auth-title">Sign in</h1>

        <form id="auth-form" novalidate>
          <div class="auth-field" id="name-group" hidden>
            <label for="auth-name">Full name</label>
            <input type="text" id="auth-name" name="name" autocomplete="name" minlength="2" maxlength="50">
          </div>

          <div class="auth-field">
            <label for="auth-email">Email address</label>
            <input type="email" id="auth-email" name="email" autocomplete="email" maxlength="254" required>
          </div>

          <div class="auth-field">
            <label for="auth-password">Password</label>
            <div class="auth-password-wrap">
              <input type="password" id="auth-password" name="password" autocomplete="current-password" required>
              <button class="password-visibility" type="button" data-password-target="auth-password" aria-label="Show password" aria-pressed="false">Show</button>
            </div>
            <small class="auth-hint" id="password-hint" hidden>Use at least 8 characters.</small>
          </div>

          <div class="auth-field" id="confirm-password-group" hidden>
            <label for="auth-confirm-password">Confirm password</label>
            <div class="auth-password-wrap">
              <input type="password" id="auth-confirm-password" name="confirmPassword" autocomplete="new-password">
              <button class="password-visibility" type="button" data-password-target="auth-confirm-password" aria-label="Show confirm password" aria-pressed="false">Show</button>
            </div>
          </div>

          <p class="auth-message" id="auth-message" role="alert" aria-live="polite"></p>
          <button class="auth-submit" type="submit" id="auth-submit-btn">Sign in</button>
        </form>

        <p class="auth-switch">
          <span id="auth-toggle-text">New to DropLab?</span>
          <button type="button" id="auth-toggle-link">Create an account</button>
        </p>
      </div>
    </section>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
