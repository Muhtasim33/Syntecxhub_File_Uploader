<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DropLab - Google Drive Clone</title>
  <link rel="stylesheet" href="/css/style.css">
  <!-- Google Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>

  <div class="app-container" id="app">
    <!-- Rendered Dynamically via JS (Sidebar, Top bar, File Grid) -->
  </div>

  <!-- Modals Container -->
  <div id="modal-container"></div>

  <!-- Authentication Modal -->
  <div id="auth-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 9999; justify-content: center; align-items: center;">
    <div style="background: white; padding: 30px; border-radius: 8px; width: 340px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
      <h2 id="auth-title" style="margin-top: 0; text-align: center; color: #333;">Login</h2>
      <form id="auth-form">
        <div id="name-group" style="display: none; margin-bottom: 12px;">
          <label style="display: block; margin-bottom: 4px; font-weight: bold; font-size: 14px; color: #555;">Name</label>
          <input type="text" id="auth-name" placeholder="Enter your name" style="width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;">
        </div>
        <div style="margin-bottom: 12px;">
          <label style="display: block; margin-bottom: 4px; font-weight: bold; font-size: 14px; color: #555;">Email</label>
          <input type="email" id="auth-email" required placeholder="Enter your email" style="width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;">
        </div>
        <div style="margin-bottom: 18px;">
          <label style="display: block; margin-bottom: 4px; font-weight: bold; font-size: 14px; color: #555;">Password</label>
          <input type="password" id="auth-password" required placeholder="Enter your password" style="width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;">
        </div>
        <button type="submit" id="auth-submit-btn" style="width: 100%; padding: 10px; background: #1a73e8; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">Login</button>
      </form>
      <p style="text-align: center; margin-top: 15px; font-size: 14px; color: #666;">
        <span id="auth-toggle-text">Don't have an account?</span>
        <a href="#" id="auth-toggle-link" style="color: #1a73e8; font-weight: bold; text-decoration: none; margin-left: 4px;">Sign Up</a>
      </p>
    </div>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
